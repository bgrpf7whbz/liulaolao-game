<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>刘姥姥一进荣国府</title>
  <link rel="stylesheet" href="style.css?v=9">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <div id="game-title">刘姥姥一进荣国府</div>
      <div id="top-status">
        <span id="progress">第 - / 16 幕</span>
        <div id="hp-bar" title="人情值">
          <div id="hp-fill"></div>
          <span id="hp-text">人情 100</span>
        </div>
        <button id="relation-btn" type="button">人物关系</button>
        <button id="manual-btn" type="button">游戏手册 <span id="manual-count">0/7</span></button>
        <button id="save-btn" type="button">存档</button>
        <button id="home-btn" type="button">主页</button>
      </div>
    </header>

    <main id="stage">
      <div id="camera-rig">
        <div id="bg-layer"></div>
        <div id="hotspot-layer"></div>
      </div>
      <div id="transition-overlay"></div>

      <div id="portrait-layer">
        <img id="speaker-portrait" src="" alt="说话人">
      </div>

      <div id="choice-panel" class="hidden"></div>

      <div id="dialog-box">
        <div id="dialog-speaker"></div>
        <div id="dialog-text"></div>
        <div id="dialog-hint">点击此处继续</div>
      </div>
    </main>

    <div id="hotspot-card" class="hidden">
      <button id="card-close" type="button" aria-label="关闭">&times;</button>
      <img id="card-image" src="" alt="">
      <h3 id="card-title"></h3>
      <p id="card-surface"></p>
      <p id="card-usage"></p>
      <p id="card-culture"></p>
      <p id="card-source"></p>
    </div>

    <div id="manual-panel" class="hidden">
      <div class="panel-content">
        <h2>游戏手册 <span id="panel-count">0/7</span></h2>
        <div class="manual-tabs">
          <button class="manual-tab active" data-tab="hotspots">文化热点</button>
          <button class="manual-tab" data-tab="characters">人物</button>
          <button class="manual-tab" data-tab="terms">词汇</button>
          <button class="manual-tab" data-tab="quests">任务</button>
        </div>
        <div id="manual-list">
          <div class="manual-section active" data-tab="hotspots" id="manual-hotspots"></div>
          <div class="manual-section" data-tab="characters" id="manual-characters"></div>
          <div class="manual-section" data-tab="terms" id="manual-terms"></div>
          <div class="manual-section" data-tab="quests" id="manual-quests"></div>
        </div>
        <button id="close-manual" type="button">关闭</button>
      </div>
    </div>

    <div id="relation-panel" class="hidden">
      <div class="panel-content">
        <h2>人物关系网</h2>
        <div id="relation-svg"></div>
        <div id="relation-list"></div>
        <button id="close-relation" type="button">关闭</button>
      </div>
    </div>

    <div id="error-modal" class="hidden">
      <div class="error-modal-bg"></div>
      <div class="error-modal-content">
        <h3 id="error-modal-title">话说得不太妥</h3>
        <div id="error-modal-text"></div>
        <div id="error-modal-reason"></div>
        <button id="error-modal-continue" type="button">我明白了，继续</button>
      </div>
    </div>

    <div id="start-screen">
      <div class="start-bg"></div>
      <div class="start-overlay"></div>
      <div class="start-content">
        <h1>刘姥姥一进荣国府</h1>
        <p>《红楼梦》第六回 · 互动叙事</p>
        <div class="start-btns">
          <button id="start-btn" type="button">进入序幕</button>
          <button id="cover-about-btn" type="button">游戏介绍</button>
          <button id="cover-rules-btn" type="button">规则说明</button>
          <button id="cover-save-btn" type="button">游戏存档</button>
        </div>
      </div>
    </div>

    <div id="cover-panel" class="hidden">
      <div class="cover-panel-bg"></div>
      <div class="cover-panel-content">
        <button id="cover-panel-close" type="button" aria-label="关闭">&times;</button>
        <h2 id="cover-panel-title"></h2>
        <div id="cover-panel-body"></div>
      </div>
    </div>

    <div id="prologue-screen" class="hidden">
      <div id="prologue-bg"></div>
      <div id="prologue-overlay"></div>
      <div id="prologue-content">
        <h2 id="prologue-title"></h2>
        <div id="prologue-text"></div>
        <div id="prologue-extra"></div>
        <button id="prologue-btn" type="button">继续</button>
      </div>
    </div>

    <div id="settlement-screen" class="hidden">
      <div class="settlement-content">
        <h2>游戏手册结算</h2>
        <p id="settlement-count"></p>
        <p id="settlement-rating"></p>
        <div id="settlement-list"></div>
        <div id="share-summary"></div>
        <div class="settlement-actions">
          <button id="share-btn" type="button">保存/分享总结</button>
          <button id="restart-btn" type="button">重新开始</button>
        </div>
      </div>
    </div>

    <div id="location-title" class="hidden"></div>
    <div id="tooltip" class="hidden"></div>
    <div id="hp-change" class="hidden"></div>
  </div>

  <script src="game.js?v=9"></script>
</body>
</html>
